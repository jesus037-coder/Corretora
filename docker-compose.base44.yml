services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corretora
      POSTGRES_USER: ze
      POSTGRES_PASSWORD: zecorretora2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ze -d corretora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./server:/app
    environment:
      - DATABASE_URL=postgresql://ze:zecorretora2026@db:5432/corretora
      - JWT_SECRET=corretora-do-ze-dev-jwt-2026
    command: sh -c "npm install && node seed.js && npx nodemon server.js"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./app:/app
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    depends_on:
      - api

volumes:
  pgdata:
