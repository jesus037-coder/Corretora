<!DOCTYPE html>

<title>Corretora do Zé — Dashboard v5</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#09110e;--surface:#101c16;--panel:#152019;--border:rgba(255,255,255,0.07);--accent:#3ddc84;--accent-dim:#1f7c47;--accent-glow:rgba(61,220,132,0.15);--red:#f25c5c;--blue:#4da6ff;--purple:#b388ff;--orange:#ffb347;--text:#e8ede9;--muted:#7a9480;--sidebar-w:260px;--radius:12px;--font-display:'DM Serif Display',Georgia,serif;--font-body:'Outfit',sans-serif;--font-mono:'DM Mono',monospace}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;overflow:hidden}::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:99px}#login-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(61,220,132,0.08) 0%,transparent 70%)}.login-wrap{width:100%;max-width:440px;padding:20px}.login-logo{text-align:center;margin-bottom:40px}.login-logo span{font-family:var(--font-display);font-size:2.2rem;color:var(--text)}.login-logo span em{color:var(--accent);font-style:italic}.login-logo p{color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:3px;margin-top:6px;font-family:var(--font-mono)}.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;box-shadow:0 40px 80px rgba(0,0,0,.5)}.login-card h2{font-family:var(--font-display);font-size:1.6rem;margin-bottom:6px;font-weight:400}.login-card p.sub{color:var(--muted);font-size:0.85rem;margin-bottom:28px}.field-group{margin-bottom:16px}.field-group label{display:block;font-size:0.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px;font-family:var(--font-mono)}.field-group input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px 16px;color:var(--text);font- tem{padding:11px 20px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:0.9rem;font-weight:500;transition:color .15s,background .15s;border-left:3px solid transparent}.nav-item:hover{color:var(--text);background:rgba(128,200,128,.04)}.nav-item.active{color:var(--accent);background:var(--accent-glow);border-left-color:var(--accent)}.nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .15s}.nav-item.active .dot{background:var(--accent)}.sidebar-foot{padding:16px 20px;border-top:1px solid var(--border);white-space:nowrap}.btn-logout{width:100%;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:var(--font-body);font-size:0.85rem;padding:9px;cursor:pointer;transition:color .2s,border-color .2s}.btn-logout:hover{color:var(--red);border-color:var(--red)}.main{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg)}.topbar{position:sticky;top:0;z-index:50;background:rgba(9,17,14,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:12px}.btn-toggle{background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--muted);width:38px;height:38px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s;flex-shrink:0}.btn-toggle:hover{color:var(--accent);border-color:var(--accent)}.topbar-title{font-family:var(--font-display);font-size:1.3rem;color:var(--text);font-weight:400;flex:1}.topbar-meta{font-family:var(--font-mono);font-size:0.72rem;color:var(--muted);white-space:nowrap}.content-area{padding:32px;max-width:1440px;margin:0 auto;width:100%}#loading-overlay{position:fixed;inset:0;z-index:200;background:rgba(9,17,14,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}#loading-overlay.vi ow{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}@media(max-width:900px){.charts-row{grid-template-columns:1fr}}.seg-cards-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}.seg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .25s,box-shadow .25s}.seg-card:hover{border-color:rgba(255,255,255,.13);box-shadow:0 8px 32px rgba(0,0,0,.3)}.seg-card-bar{height:3px;width:100%}.seg-card-header{padding:14px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:background .15s}.seg-card-header:hover{background:rgba(255,255,255,.02)}.seg-card-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700;font-family:var(--font-mono);flex-shrink:0;letter-spacing:0.5px;text-align:center;line-height:1.2}.seg-card-kpis{flex:1;display:flex;align-items:center;gap:0}.seg-kpi-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 8px;border-right:1px solid var(--border)}.seg-kpi-item:last-child{border-right:none}.seg-kpi-label{font-family:var(--font-mono);font-size:0.58rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}.seg-kpi-val{font-family:var(--font-mono);font-size:0.88rem;font-weight:600;color:var(--text)}.seg-kpi-val.pos{color:var(--accent)}.seg-kpi-val.neg{color:var(--red)}.seg-card-chevron{font-size:0.75rem;color:var(--muted);transition:transform .25s cubic-bezier(0.4,0,0.2,1);font-family:var(--font-mono);flex-shrink:0}.seg-card.open .seg-card-chevron{transform:rotate(90deg)}.seg-card-body{display:none;overflow-x:auto;border-top:1px solid var(--border)}.seg-card.open .seg-card-body{display:block}.seg-inner-table{width:100%;border-collapse:collapse;min-width:680px;font-size:0.82rem}.seg-inner-table thead th{background:var(--panel);color:var(--muted);font-family:var(--font-mono);font-size:0.62rem;font-weight:500;text-transform:uppercase;letter-spacing:1px;padding:11px 14px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;cursor:default}.seg-inner-table thead th:first-child{text-align:left}.seg-inner-table tbody td{padding:0 14px;height:46px;border-bottom:1px solid var(--border);text-align:center;color:var(--text);font-family:var(--font-mono);font-size:0.82rem}.seg-inner-table tbody tr:last-child td{border-bottom:none}.seg-inner-table tbody tr:hover td{background:rgba(255,255,255,.025)}.seg-inner-table td:first-child{text-align:left;font-weight:700;font-size:0.88rem}.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}.tbl-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px;font-size:0.9rem}thead th{background:var(--panel);color:var(--muted);font-family:var(--font-mono);font-size:0.68rem;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;padding:14px 14px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;transition:color .2s}thead th:hover{color:var(--accent)}tbody td{padding:0 14px;height:50px;border-bottom:1px solid var(--border);text-align:center;color:var(--text);font-family:var(--font-mono);font-size:0.84rem;transition:background .15s}tbody tr:last-child td{border-bottom:none}tbody tr:hover td{background:rgba(255,255,255,.02)}.td-ticker{text-align:left!important;font-weight:600;color:var(--text);position:sticky;left:0;z-index:2;background:var(--surface)}tr:hover .td-ticker{background:rgba(255,255,255,.03)}.seg-row td{background:var(--panel)!important;text-align:left!important;padding-left:16px!important;color:var(--muted);font-size:0.7rem;text-transform:uppercase;letter-spacing:2px;cursor:pointer;border-bottom:1px solid var(--border);font-family:var(--font-mono)}.seg-row:hover td{color:var(--accent)!important}.hidden-row{display:none}tfoot td{background:var(--panel)!important;color:var(--accent)!important;font-weight:600;font-family:var(--font-mono);border-top:1px solid var(--border);padding:12px 14px;text-align:center}tfoot .td-ticker{background:var(--panel)!important;color:var(--accent)!important;text-align:left!important}.prov-cell{line-height:1.3}.prov-unit{color:var(--text);font-size:0.84rem}.prov-extra{display:none;font-size:0.68rem;color:var(--muted);margin-top:2px}.prov-total{display:none;font-size:0.68rem;color:var(--accent)}.col-active .prov-unit{color:var(--muted);font-size:0.7rem}.col-active .prov-extra,.col-active .prov-total{display:block}.empty-state{padding:80px 40px;text-align:center}.empty-state .icon{font-size:3rem;margin-bottom:16px;opacity:.3}.empty-state p{color:var(--muted);font-size:0.95rem}@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}.animate-in{animation:fadeUp .4s ease forwards}.btn-reiniciar{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:var(--font-mono);font-size:0.62rem;padding:5px 10px;border-radius:6px;cursor:pointer;transition:color .2s,border-color .2s}.btn-reiniciar:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">
      <span>Corretora do <em>Zé</em></span>
      <p>Investment Dashboard v5</p>
    </div>
    <div class="login-card">
      <h2>Acesso Restrito</h2>
      <p class="sub">Insira suas credenciais para continuar</p>
      <div class="field-group"><label>E-mail</label><input type="email" id="inp-email" placeholder="seu@email.com" autocomplete="email"/></div>
      <div class="field-group"><label>Senha</label><input type="password" id="inp-senha" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar</button>
      <div id="login-error"></div>
    </div>
  </div>
</div>
<div id="loading-overlay"><div class="loader-ring"></div><div class="loader-text">Carregando dados…</div></div>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top"><div class="brand">Corretora do <em>Zé</em></div><div class="role-tag" id="role-tag">Carregando…</div></div>
    <div class="ano-block"><label>Ano de referência</label>
      <select id="sel-ano" onchange="recarregarDados()">
        <option value="TODOS">📅 Todos os Anos</option>
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
    </div>
    <nav class="nav-list" id="nav-list"></nav>
    <div class="sidebar-foot"><button class="btn-logout" onclick="logout()">↩ Sair</button></div>
  </aside>
  <div class="main" id="main">
    <div class="topbar">
      <button class="btn-toggle" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-meta" id="topbar-meta"></div>
    </div>
    <div class="content-area" id="content-area"><div class="empty-state"><div class="icon">📊</div><p>Selecione um cliente na barra lateral.</p></div></div>
  </div>
</div>
<script>
