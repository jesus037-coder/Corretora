<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Corretora do Zé — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* =========================================================
   DESIGN SYSTEM — Corretora do Zé
   Aesthetic: Refined Financial Dark — luxury broker meets
   terminal clarity. Deep forest greens, warm off-whites,
   monospaced accents, generous negative space.
========================================================= */
:root {
  --bg:        #09110e;
  --surface:   #101c16;
  --panel:     #152019;
  --border:    rgba(255,255,255,0.07);
  --accent:    #3ddc84;
  --accent-dim:#1f7c47;
  --accent-glow: rgba(61,220,132,0.15);
  --red:       #f25c5c;
  --blue:      #4da6ff;
  --purple:    #b388ff;
  --text:      #e8ede9;
  --muted:     #7a9480;
  --sidebar-w: 260px;
  --radius:    12px;
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body:    'Outfit', sans-serif;
  --font-mono:    'DM Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
}

/* ---- SCROLLBARS ---- */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 99px; }

/* =========================================================
   LOGIN SCREEN
========================================================= */
#login-screen {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(61,220,132,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 80% 80%, rgba(77,166,255,0.04) 0%, transparent 60%);
}

.login-wrap {
  width: 100%; max-width: 420px; padding: 20px;
}

.login-logo {
  text-align: center; margin-bottom: 40px;
}
.login-logo span {
  font-family: var(--font-display); font-size: 2rem;
  color: var(--text); letter-spacing: -0.5px;
}
.login-logo span em {
  color: var(--accent); font-style: italic;
}
.login-logo p {
  color: var(--muted); font-size: 0.8rem; text-transform: uppercase;
  letter-spacing: 3px; margin-top: 6px; font-family: var(--font-mono);
}

.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
}

.login-card h2 {
  font-family: var(--font-display); font-size: 1.5rem;
  margin-bottom: 6px; font-weight: 400;
}
.login-card p.sub {
  color: var(--muted); font-size: 0.8rem; margin-bottom: 28px;
}

.field-group { margin-bottom: 16px; }
.field-group label {
  display: block; font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 2px; color: var(--muted); margin-bottom: 8px;
  font-family: var(--font-mono);
}
.field-group input {
  width: 100%; background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; color: var(--text);
  font-family: var(--font-mono); font-size: 0.9rem;
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.field-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.btn-login {
  width: 100%; margin-top: 24px;
  background: var(--accent); color: var(--bg);
  border: none; border-radius: 8px;
  padding: 13px; font-family: var(--font-body);
  font-size: 0.9rem; font-weight: 700;
  cursor: pointer; letter-spacing: 0.5px;
  transition: opacity 0.2s, transform 0.1s;
}
.btn-login:hover { opacity: 0.9; }
.btn-login:active { transform: scale(0.98); }
.btn-login:disabled { opacity: 0.4; cursor: not-allowed; }

#login-error {
  color: var(--red); font-size: 0.8rem; text-align: center;
  margin-top: 14px; display: none;
  padding: 10px; background: rgba(242,92,92,0.08);
  border-radius: 6px; border: 1px solid rgba(242,92,92,0.2);
}

/* =========================================================
   APP LAYOUT
========================================================= */
#app {
  display: none; height: 100vh;
  flex-direction: row;
}
#app.visible { display: flex; }

/* ---- SIDEBAR ---- */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width 0.3s cubic-bezier(.4,0,.2,1),
              min-width 0.3s cubic-bezier(.4,0,.2,1),
              opacity 0.3s;
  overflow: hidden;
}
.sidebar.collapsed { width: 0; min-width: 0; opacity: 0; }

.sidebar-top {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.sidebar-top .brand {
  font-family: var(--font-display); font-size: 1.1rem;
  color: var(--text); margin-bottom: 2px;
}
.sidebar-top .brand em { color: var(--accent); font-style: italic; }
.sidebar-top .role-tag {
  font-family: var(--font-mono); font-size: 0.65rem;
  color: var(--muted); text-transform: uppercase; letter-spacing: 2px;
}

.ano-block {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.ano-block label {
  display: block; font-size: 0.65rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 2px;
  font-family: var(--font-mono); margin-bottom: 8px;
}
.ano-block select {
  width: 100%; background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-family: var(--font-mono);
  font-size: 0.85rem; padding: 8px 12px; outline: none; cursor: pointer;
}
.ano-block select:focus { border-color: var(--accent); }

.nav-list {
  flex: 1; overflow-y: auto; padding: 12px 0;
}

.nav-item {
  padding: 11px 20px; cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 10px;
  color: var(--muted); font-size: 0.85rem; font-weight: 500;
  transition: color 0.15s, background 0.15s;
  border-left: 3px solid transparent;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.nav-item.active {
  color: var(--accent); background: var(--accent-glow);
  border-left-color: var(--accent);
}
.nav-item .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0; transition: background 0.15s;
}
.nav-item.active .dot { background: var(--accent); }

.sidebar-foot {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  white-space: nowrap;
}
.btn-logout {
  width: 100%; background: transparent;
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--muted); font-family: var(--font-body);
  font-size: 0.8rem; padding: 9px; cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.btn-logout:hover { color: var(--red); border-color: var(--red); }

/* ---- MAIN CONTENT ---- */
.main {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  background: var(--bg);
  background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(61,220,132,0.04) 0%, transparent 60%);
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(9,17,14,0.85); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  display: flex; align-items: center; gap: 16px;
}
.btn-toggle {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; color: var(--muted);
  width: 36px; height: 36px; cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s, border-color 0.2s;
}
.btn-toggle:hover { color: var(--accent); border-color: var(--accent); }

.topbar-title {
  font-family: var(--font-display); font-size: 1.2rem;
  color: var(--text); font-weight: 400; flex: 1;
}
.topbar-meta {
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
}

/* ---- CONTENT AREA ---- */
.content-area { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; }

/* ---- LOADING ---- */
#loading-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(9,17,14,0.85); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;
}
#loading-overlay.visible { display: flex; }
.loader-ring {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text {
  font-family: var(--font-mono); font-size: 0.75rem;
  color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
}

/* =========================================================
   KPI CARDS
========================================================= */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 32px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  position: relative; overflow: hidden;
  transition: border-color 0.2s;
}
.kpi-card::after {
  content: ''; position: absolute;
  bottom: 0; left: 0; right: 0; height: 2px;
  background: var(--accent); opacity: 0.3;
  border-radius: 0 0 var(--radius) var(--radius);
}
.kpi-card.negative::after { background: var(--red); }
.kpi-card:hover { border-color: rgba(255,255,255,0.12); }
.kpi-label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2px;
  color: var(--muted); font-family: var(--font-mono); margin-bottom: 10px;
}
.kpi-value {
  font-family: var(--font-mono); font-size: 1.55rem;
  font-weight: 500; color: var(--text); line-height: 1.2;
}
.kpi-value.positive { color: var(--accent); }
.kpi-value.negative { color: var(--red); }
.kpi-sub {
  font-family: var(--font-mono); font-size: 0.8rem;
  color: var(--muted); margin-top: 4px;
}

/* =========================================================
   SECTION HEADERS
========================================================= */
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; margin-top: 36px;
}
.section-head h3 {
  font-family: var(--font-display); font-weight: 400;
  font-size: 1.3rem; color: var(--text);
}
.section-head .pill {
  background: var(--accent-glow); color: var(--accent);
  font-family: var(--font-mono); font-size: 0.65rem;
  padding: 3px 10px; border-radius: 99px;
  border: 1px solid rgba(61,220,132,0.25);
  text-transform: uppercase; letter-spacing: 1px;
}

/* =========================================================
   CHARTS
========================================================= */
.chart-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px; margin-bottom: 24px;
}
.chart-block-title {
  font-family: var(--font-mono); font-size: 0.7rem;
  color: var(--muted); text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 16px;
}
.charts-row {
  display: grid; grid-template-columns: 2fr 1fr; gap: 20px;
  margin-bottom: 24px;
}
@media (max-width: 900px) {
  .charts-row { grid-template-columns: 1fr; }
}

/* =========================================================
   TABLES
========================================================= */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden; margin-bottom: 24px;
}
.tbl-scroll { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse;
  min-width: 900px; font-size: 0.92rem;
}
thead th {
  background: var(--panel);
  color: var(--muted); font-family: var(--font-mono);
  font-size: 0.72rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1.5px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; white-space: nowrap; user-select: none;
  transition: color 0.2s;
}
thead th:hover { color: var(--accent); }

tbody td {
  padding: 0 16px; height: 52px;
  border-bottom: 1px solid var(--border);
  text-align: center; color: var(--text);
  font-family: var(--font-mono); font-size: 0.88rem;
  transition: background 0.15s;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(255,255,255,0.02); }

.td-ticker {
  text-align: left !important;
  font-weight: 600; color: var(--text);
  position: sticky; left: 0; z-index: 2;
  background: var(--surface);
}
tr:hover .td-ticker { background: #1a2c22; }

.seg-row td {
  background: var(--panel) !important;
  text-align: left !important; padding-left: 16px !important;
  color: var(--muted); font-size: 0.7rem;
  text-transform: uppercase; letter-spacing: 2px;
  cursor: pointer; border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
}
.seg-row:hover td { color: var(--accent) !important; }

.hidden-row { display: none; }

tfoot td {
  background: var(--panel) !important;
  color: var(--accent) !important;
  font-weight: 600; font-family: var(--font-mono);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  text-align: center;
}
tfoot .td-ticker {
  background: var(--panel) !important;
  color: var(--accent) !important;
  text-align: left !important;
}

/* provento cell detail */
.prov-cell { line-height: 1.3; }
.prov-unit { color: var(--text); font-size: 0.88rem; }
.prov-extra { display: none; font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
.prov-total { display: none; font-size: 0.72rem; color: var(--accent); }
.col-active .prov-unit { color: var(--muted); font-size: 0.72rem; }
.col-active .prov-extra,
.col-active .prov-total { display: block; }

/* badge */
.type-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 0.62rem; font-weight: 600; font-family: var(--font-mono);
  text-transform: uppercase; letter-spacing: 1px;
}
.badge-fii { background: rgba(77,166,255,0.15); color: var(--blue); }
.badge-etf { background: rgba(179,136,255,0.15); color: var(--purple); }
.badge-acao { background: rgba(242,92,92,0.12); color: var(--red); }
.badge-other { background: rgba(122,148,128,0.15); color: var(--muted); }

/* =========================================================
   EMPTY STATE
========================================================= */
.empty-state {
  padding: 80px 40px; text-align: center;
}
.empty-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
.empty-state p { color: var(--muted); font-size: 0.9rem; }

/* =========================================================
   ANIMATIONS
========================================================= */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.animate-in { animation: fadeUp 0.4s ease forwards; }
.animate-in:nth-child(2) { animation-delay: 0.05s; }
.animate-in:nth-child(3) { animation-delay: 0.1s; }
.animate-in:nth-child(4) { animation-delay: 0.15s; }

/* reiniciar btn in table */
.btn-reiniciar {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-family: var(--font-mono);
  font-size: 0.62rem; padding: 5px 10px; border-radius: 6px;
  cursor: pointer; white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}
.btn-reiniciar:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">
      <span>Corretora do <em>Zé</em></span>
      <p>Investment Dashboard v3</p>
    </div>
    <div class="login-card">
      <h2>Acesso Restrito</h2>
      <p class="sub">Insira suas credenciais para continuar</p>
      <div class="field-group">
        <label>E-mail</label>
        <input type="email" id="inp-email" placeholder="seu@email.com" autocomplete="email" />
      </div>
      <div class="field-group">
        <label>Senha</label>
        <input type="password" id="inp-senha" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar</button>
      <div id="login-error"></div>
    </div>
  </div>
</div>

<!-- ===================== LOADING ===================== -->
<div id="loading-overlay">
  <div class="loader-ring"></div>
  <div class="loader-text">Carregando dados…</div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">Corretora do <em>Zé</em></div>
      <div class="role-tag" id="role-tag">Carregando…</div>
    </div>
    <div class="ano-block">
      <label>Ano de referência</label>
      <select id="sel-ano" onchange="recarregarDados()">
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
    </div>
    <nav class="nav-list" id="nav-list"></nav>
    <div class="sidebar-foot">
      <button class="btn-logout" onclick="logout()">↩ Sair</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main" id="main">
    <div class="topbar">
      <button class="btn-toggle" onclick="toggleSidebar()" title="Alternar menu">☰</button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-meta" id="topbar-meta"></div>
    </div>
    <div class="content-area" id="content-area">
      <div class="empty-state">
        <div class="icon">📊</div>
        <p>Selecione um cliente na barra lateral.</p>
      </div>
    </div>
  </div>
</div>

<script>
/* =======================================================
   CONFIGURAÇÃO — URLs das bases públicas CSV
======================================================= */
const CSV = {
  CLIENTES:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSK8g8oRJz0bjVrf1h-VkiexuxLkn1G089uORtY7ZZH-nJdjIB4PMUnqx9y8N0CA1ujpi9e5aV_XKf/pub?gid=42982816&single=true&output=csv',
  PATRIMONIO: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSK8g8oRJz0bjVrf1h-VkiexuxLkn1G089uORtY7ZZH-nJdjIB4PMUnqx9y8N0CA1ujpi9e5aV_XKf/pub?gid=1605208368&single=true&output=csv',
  DIVIDENDOS: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSK8g8oRJz0bjVrf1h-VkiexuxLkn1G089uORtY7ZZH-nJdjIB4PMUnqx9y8N0CA1ujpi9e5aV_XKf/pub?gid=948257245&single=true&output=csv',
  ATIVOS:     'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSK8g8oRJz0bjVrf1h-VkiexuxLkn1G089uORtY7ZZH-nJdjIB4PMUnqx9y8N0CA1ujpi9e5aV_XKf/pub?gid=713165597&single=true&output=csv',
};

/* =======================================================
   ESTADO GLOBAL
======================================================= */
let SESSION = { nome: '', isAdmin: false };
let GLOBAL  = { patrimonio: {}, proventos: {}, precos: {}, evolucao: {}, listaClientes: [] };
let anoSel  = 2026;
let chartsBar = null, chartsPie = null, chartsEvol = null;
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

/* =======================================================
   UTILITÁRIOS
======================================================= */
function limpar(val) {
  if (val === null || val === undefined || val === '') return 0;
  if (typeof val === 'number') return val;
  let n = parseFloat(val.toString().replace('R$','').replace(/\./g,'').replace(',','.').trim());
  return isNaN(n) ? 0 : n;
}

function tratarData(s) {
  if (!s) return null;
  s = s.toString().trim();
  if (s.includes('/')) {
    const p = s.split('/');
    if (p.length === 3) return new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

async function fetchCSV(url) {
  const r = await fetch(url);
  const t = await r.text();
  return parseCSV(t);
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

function fmt(n) {
  return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
}

function badgeClass(tipo) {
  if (!tipo) return 'badge-other';
  const t = tipo.toUpperCase();
  if (t.includes('FII')) return 'badge-fii';
  if (t.includes('ETF')) return 'badge-etf';
  if (t.includes('AÇ') || t.includes('ACAO') || t.includes('AÇÃO')) return 'badge-acao';
  return 'badge-other';
}

function showLoading(v) {
  document.getElementById('loading-overlay').classList.toggle('visible', v);
}

/* =======================================================
   LOGIN
======================================================= */
document.getElementById('inp-senha').addEventListener('keypress', e => {
  if (e.key === 'Enter') fazerLogin();
});

async function fazerLogin() {
  const email = document.getElementById('inp-email').value.trim().toLowerCase();
  const senha = document.getElementById('inp-senha').value.trim();
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('btn-login');
  errEl.style.display = 'none';

  if (!email || !senha) {
    errEl.textContent = 'Preencha todos os campos.';
    errEl.style.display = 'block'; return;
  }

  btn.disabled = true; btn.textContent = 'Verificando…';
  showLoading(true);

  try {
    const rows = await fetchCSV(CSV.CLIENTES);
    // Cols: 0:ID, 1:EMAIL, 2:SENHA, 3:NOME, 4:PASTA_ID, 5:STATUS
    let found = false;
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const emailDb = (row[1] || '').trim().toLowerCase();
      const senhaDb = (row[2] || '').trim();
      if (emailDb === email && senhaDb === senha) {
        const nome   = (row[3] || '').trim();
        const status = (row[5] || '').trim().toUpperCase();
        SESSION.nome    = nome;
        SESSION.isAdmin = (status === 'ADMIN' || status === 'ADMINISTRADOR');
        found = true; break;
      }
    }
    if (!found) throw new Error('E-mail ou senha incorretos.');

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('role-tag').textContent =
      SESSION.isAdmin ? 'Administrador' : SESSION.nome;

    await iniciarDados();
  } catch(e) {
    errEl.textContent = e.message || 'Erro ao conectar.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
    showLoading(false);
  }
}

function logout() {
  SESSION = { nome: '', isAdmin: false };
  GLOBAL  = { patrimonio: {}, proventos: {}, precos: {}, evolucao: {}, listaClientes: [] };
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('inp-email').value = '';
  document.getElementById('inp-senha').value = '';
  document.getElementById('content-area').innerHTML = '';
  document.getElementById('nav-list').innerHTML = '';
}

/* =======================================================
   CARREGAMENTO DE DADOS
======================================================= */
async function iniciarDados() {
  showLoading(true);
  anoSel = parseInt(document.getElementById('sel-ano').value);
  try {
    const [rowsAtivos, rowsPat, rowsDiv] = await Promise.all([
      fetchCSV(CSV.ATIVOS),
      fetchCSV(CSV.PATRIMONIO),
      fetchCSV(CSV.DIVIDENDOS),
    ]);

    GLOBAL.precos = {};
    GLOBAL.patrimonio = {};
    GLOBAL.evolucao   = {};
    GLOBAL.listaClientes = [];

    // 1. PRECOS — cols: 0,1,2:TICKER,3:PRECO
    for (let i = 1; i < rowsAtivos.length; i++) {
      const ticker = (rowsAtivos[i][2] || '').trim().toUpperCase();
      if (ticker) GLOBAL.precos[ticker] = limpar(rowsAtivos[i][3]);
    }

    // 2. PATRIMÔNIO — cols: 0:CLIENTE,1:ATIVO,2:TIPO,3:CV,4:QTD,5:??,6:TOTAL,7:DATA
    for (let r = 1; r < rowsPat.length; r++) {
      const row = rowsPat[r];
      let cliente = (row[0] || '').trim();
      if (!cliente || cliente.toUpperCase() === 'CLIENTE' || cliente.length < 3) continue;
      if (/[A-Z]{4}[0-9]/.test(cliente)) continue;

      if (!SESSION.isAdmin && cliente.toUpperCase() !== SESSION.nome.toUpperCase()) continue;

      if (!GLOBAL.listaClientes.includes(cliente)) GLOBAL.listaClientes.push(cliente);
      if (!GLOBAL.patrimonio[cliente]) GLOBAL.patrimonio[cliente] = [];
      if (!GLOBAL.evolucao[cliente])   GLOBAL.evolucao[cliente]   = Array(12).fill(0);

      const dataObj = tratarData(row[7]);
      if (dataObj) {
        const anoLanc = dataObj.getFullYear();
        if (anoLanc <= anoSel) {
          const cv = (row[3] || '').toUpperCase();
          const totalOp = limpar(row[6]);
          const valorAjustado = cv.includes('C') ? totalOp : -totalOp;

          GLOBAL.patrimonio[cliente].push({
            ativo: (row[1] || '').trim().toUpperCase(),
            tipo:  (row[2] || '').trim().toUpperCase(),
            cv,
            qtd:      limpar(row[4]),
            total:    totalOp,
            dataLanc: row[7],
          });

          const mesInicio = anoLanc < anoSel ? 0 : dataObj.getMonth();
          for (let m = mesInicio; m < 12; m++) {
            GLOBAL.evolucao[cliente][m] += valorAjustado;
          }
        }
      }
    }

    // 3. DIVIDENDOS / PROVENTOS
    GLOBAL.proventos = processarProventos(rowsDiv, GLOBAL.patrimonio, anoSel);

    GLOBAL.listaClientes.sort();
    renderSidebar();

    if (GLOBAL.listaClientes.length > 0) {
      const alvo = SESSION.isAdmin ? GLOBAL.listaClientes[0] : SESSION.nome;
      selectCliente(alvo);
    } else {
      document.getElementById('content-area').innerHTML =
        '<div class="empty-state"><div class="icon">🔍</div><p>Nenhum dado encontrado para este usuário.</p></div>';
    }
  } catch(e) {
    document.getElementById('content-area').innerHTML =
      `<div class="empty-state"><div class="icon">⚠️</div><p>Erro ao carregar: ${e.message}</p></div>`;
  }
  showLoading(false);
}

function recarregarDados() {
  document.getElementById('content-area').innerHTML = '';
  iniciarDados();
}

/* =======================================================
   PROCESSAR PROVENTOS
======================================================= */
function processarProventos(rowsDiv, patrimonio, anoAlvo) {
  const resultado = {};
  const anuncios  = {};

  // cols: 0:TICKER, 1:SEGMENTO, 2:DATA_COM, 3:DATA_PAGTO, 4:TIPO, 5:VALOR
  for (let r = 1; r < rowsDiv.length; r++) {
    const row = rowsDiv[r];
    const ticker = (row[0] || '').trim().toUpperCase();
    const seg    = (row[1] || 'OUTROS').trim().toUpperCase();
    const dataCom   = tratarData(row[2]);
    const dataPagto = tratarData(row[3]);
    const tipo = (row[4] || '').toUpperCase();
    const valorUnit = limpar(row[5]);

    const dataRef = dataPagto || dataCom;
    if (!ticker || !dataRef || dataRef.getFullYear() !== anoAlvo) continue;

    let fator = 1.0;
    if (tipo.includes('JCP') || tipo.includes('ETF')) fator = 0.85;
    else if (tipo.includes('EXTERIOR') || tipo.includes('BDR')) fator = 0.70;

    const vliq  = Math.round(valorUnit * fator * 100) / 100;
    const mes   = dataRef.getMonth();

    if (!anuncios[ticker]) anuncios[ticker] = {};
    if (!anuncios[ticker][mes]) anuncios[ticker][mes] = { valor: 0, dataCom, segmento: seg };
    anuncios[ticker][mes].valor = Math.round((anuncios[ticker][mes].valor + vliq) * 100) / 100;
  }

  for (const cliente in patrimonio) {
    resultado[cliente] = { segmentos: {}, totaisMensais: Array(12).fill(0) };
    const movs = patrimonio[cliente];
    const tickers = [...new Set(movs.map(m => m.ativo))];

    tickers.forEach(ticker => {
      const dadosMeses = [];
      let segmentoAtivo = '';

      for (let m = 0; m < 12; m++) {
        const info = anuncios[ticker]?.[m] || null;
        let qtdSaldo = 0, subtotal = 0;

        if (info) {
          segmentoAtivo = info.segmento;
          movs.forEach(mov => {
            if (mov.ativo !== ticker) return;
            const dMov = tratarData(mov.dataLanc);
            if (dMov && dMov <= info.dataCom) {
              const q = limpar(mov.qtd);
              qtdSaldo += mov.cv.includes('C') ? q : -q;
            }
          });
          if (qtdSaldo > 0) {
            subtotal = Math.round(qtdSaldo * info.valor * 100) / 100;
            resultado[cliente].totaisMensais[m] =
              Math.round((resultado[cliente].totaisMensais[m] + subtotal) * 100) / 100;
          }
        }
        dadosMeses.push({
          qtd: qtdSaldo,
          unit: info ? info.valor.toFixed(2) : '0.00',
          sub:  subtotal,
        });
      }

      if (dadosMeses.some(d => d.sub > 0)) {
        const seg = segmentoAtivo || 'OUTROS';
        if (!resultado[cliente].segmentos[seg]) resultado[cliente].segmentos[seg] = [];
        resultado[cliente].segmentos[seg].push({ ticker, dadosMeses });
      }
    });
  }
  return resultado;
}

/* =======================================================
   RENDERIZAR CLIENTE
======================================================= */
function selectCliente(nome) {
  setNavActive(nome);
  document.getElementById('topbar-title').textContent = nome;
  document.getElementById('topbar-meta').textContent  =
    `Ano ${anoSel} · Atualizado agora`;

  const info    = GLOBAL.proventos[nome]  || { segmentos: {}, totaisMensais: Array(12).fill(0) };
  const movs    = GLOBAL.patrimonio[nome] || [];
  const precos  = GLOBAL.precos;

  /* ---- Consolidar carteira ---- */
  const consolid = {};
  let totalAplAtual = 0, totalAtualMkt = 0, qtdAtivos = 0;

  movs.forEach(item => {
    const ticker = item.ativo;
    const seg    = item.tipo || 'OUTROS';
    const qtd    = limpar(item.qtd);
    const total  = limpar(item.total);
    const isC    = item.cv?.toUpperCase().includes('C');

    if (!consolid[seg]) consolid[seg] = {};
    if (!consolid[seg][ticker]) consolid[seg][ticker] = { qtdTotal: 0, valorAplicado: 0 };

    if (isC) {
      consolid[seg][ticker].qtdTotal    += qtd;
      consolid[seg][ticker].valorAplicado += total;
    } else {
      const prev    = consolid[seg][ticker];
      const pmAntes = prev.qtdTotal > 0 ? prev.valorAplicado / prev.qtdTotal : 0;
      prev.qtdTotal     -= qtd;
      prev.valorAplicado -= qtd * pmAntes;
    }
  });

  Object.values(consolid).forEach(segs => {
    Object.values(segs).forEach(item => {
      if (item.qtdTotal > 0.0001) {
        const pm = precos[Object.keys(segs).find(k => segs[k] === item)] || 0;
        totalAplAtual += item.valorAplicado;
        totalAtualMkt += item.qtdTotal * (pm || 0);
        qtdAtivos++;
      }
    });
  });
  // recalculate correctly with ticker key
  totalAplAtual = 0; totalAtualMkt = 0; qtdAtivos = 0;
  Object.entries(consolid).forEach(([seg, tickers]) => {
    Object.entries(tickers).forEach(([ticker, item]) => {
      if (item.qtdTotal > 0.0001) {
        const pm = precos[ticker] || 0;
        totalAplAtual += item.valorAplicado;
        totalAtualMkt += item.qtdTotal * pm;
        qtdAtivos++;
      }
    });
  });

  const totalProv   = info.totaisMensais.reduce((a,b) => a+b, 0);
  const lucroPatr   = totalAtualMkt - totalAplAtual;
  const lucroTotal  = lucroPatr + totalProv;
  const rentTotal   = totalAplAtual > 0 ? (lucroTotal / totalAplAtual) * 100 : 0;
  const pctIdeal    = qtdAtivos > 0 ? 100 / qtdAtivos : 0;

  /* ---- Build HTML ---- */
  let html = '';

  /* KPIs */
  html += `<div class="kpi-grid">`;
  html += kpiCard('Valor Aplicado',      fmt(totalAplAtual),   '',     rentTotal >= 0 ? '' : '');
  html += kpiCard('Valor Atual (Mercado)',fmt(totalAtualMkt),   '',     '', 'positive');
  html += kpiCard('Proventos no Ano',     fmt(totalProv),       '');
  html += kpiCard('Rentabilidade Total',
    `${rentTotal >= 0 ? '▲' : '▼'} ${rentTotal.toFixed(2)}%`,
    fmt(lucroTotal),
    rentTotal >= 0 ? '' : 'negative',
    rentTotal >= 0 ? 'positive' : 'negative');
  html += `</div>`;

  /* Evolução */
  html += `
    <div class="section-head"><h3>Evolução do Patrimônio</h3><span class="pill">custo acumulado</span></div>
    <div class="chart-block">
      <div class="chart-block-title">Patrimônio Investido — ${anoSel}</div>
      <div style="height:240px;"><canvas id="cvs-evol"></canvas></div>
    </div>`;

  /* Carteira */
  html += `<div class="section-head"><h3>Consolidação de Carteira</h3><span class="pill">${qtdAtivos} ativos</span></div>`;
  html += `<div class="table-wrap"><div class="tbl-scroll"><table>
    <thead><tr>
      <th style="text-align:left">Ativo</th>
      <th>Qtd</th><th>Preço Médio</th><th>Vlr Aplicado</th>
      <th>Preço Atual</th><th>Var %</th><th>L/P (R$)</th>
      <th>Total Atual</th><th>% Atual</th><th>% Ideal</th>
    </tr></thead>
    <tbody>`;

  Object.entries(consolid).forEach(([seg, tickers]) => {
    const valid = Object.keys(tickers).filter(t => tickers[t].qtdTotal > 0.0001);
    if (!valid.length) return;
    const segId = 'cs-' + seg.replace(/\W+/g,'-');
    html += `<tr class="seg-row" onclick="toggleSeg('${segId}')">
      <td colspan="10">▸ ${seg} <span class="type-badge ${badgeClass(seg)}">${seg}</span></td>
    </tr>`;
    valid.forEach(ticker => {
      const item     = tickers[ticker];
      const pmkt     = precos[ticker] || 0;
      const pm       = item.valorAplicado / item.qtdTotal;
      const vAtual   = item.qtdTotal * pmkt;
      const lp       = vAtual - item.valorAplicado;
      const varpct   = pm > 0 ? ((pmkt / pm) - 1) * 100 : 0;
      const pctCart  = totalAtualMkt > 0 ? (vAtual / totalAtualMkt) * 100 : 0;
      html += `<tr class="${segId} hidden-row">
        <td class="td-ticker">${ticker}</td>
        <td>${item.qtdTotal.toLocaleString('pt-BR', {maximumFractionDigits:2})}</td>
        <td>${fmt(pm)}</td>
        <td>${fmt(item.valorAplicado)}</td>
        <td style="color:var(--accent)">${fmt(pmkt)}</td>
        <td style="color:${varpct>=0?'var(--accent)':'var(--red)'}">${varpct.toFixed(2)}%</td>
        <td style="color:${lp>=0?'var(--accent)':'var(--red)'}">${fmt(lp)}</td>
        <td>${fmt(vAtual)}</td>
        <td>${pctCart.toFixed(2)}%</td>
        <td style="color:var(--muted)">${pctIdeal.toFixed(2)}%</td>
      </tr>`;
    });
  });

  html += `</tbody>
    <tfoot><tr>
      <td class="td-ticker" colspan="3">TOTAL GERAL</td>
      <td>${fmt(totalAplAtual)}</td>
      <td></td>
      <td style="color:${lucroPatr>=0?'var(--accent)':'var(--red)'}">
        ${(totalAplAtual>0?(lucroPatr/totalAplAtual*100):0).toFixed(2)}%
      </td>
      <td style="color:${lucroPatr>=0?'var(--accent)':'var(--red)'}">${fmt(lucroPatr)}</td>
      <td>${fmt(totalAtualMkt)}</td>
      <td colspan="2">100%</td>
    </tr></tfoot>
  </table></div></div>`;

  /* Proventos */
  html += `<div class="section-head" style="margin-top:40px"><h3>Proventos Recebidos</h3><span class="pill">ano ${anoSel}</span></div>`;
  html += `<div class="charts-row">
    <div class="chart-block" style="margin-bottom:0">
      <div class="chart-block-title">Distribuição Mensal (R$)</div>
      <div style="height:200px;"><canvas id="cvs-bar"></canvas></div>
    </div>
    <div class="chart-block" style="margin-bottom:0">
      <div class="chart-block-title">Por Segmento</div>
      <div style="height:200px;"><canvas id="cvs-pie"></canvas></div>
    </div>
  </div>`;

  html += `<div class="table-wrap" style="margin-top:20px"><div class="tbl-scroll"><table>
    <thead><tr>
      <th style="text-align:left">
        <button class="btn-reiniciar" onclick="updateCharts('${nome}','TOTAL')">↺ Reiniciar</button>
      </th>
      ${MESES.map((m,i) => `<th onclick="toggleColProv(${i},'${nome}')">${m}</th>`).join('')}
    </tr></thead>
    <tbody>`;

  Object.entries(info.segmentos).forEach(([seg, ativos]) => {
    const segId = 'pv-' + seg.replace(/\W+/g,'-');
    html += `<tr class="seg-row" onclick="toggleProvSeg('${segId}','${seg}','${nome}')">
      <td colspan="13">▸ ${seg} <span class="type-badge ${badgeClass(seg)}">${seg}</span></td>
    </tr>`;
    ativos.forEach(ativo => {
      html += `<tr class="${segId} hidden-row">
        <td class="td-ticker" style="padding-left:28px">${ativo.ticker}</td>
        ${ativo.dadosMeses.map((mes,i) => `
          <td class="prov-col-${i}">
            <div class="prov-cell">
              <div class="prov-unit">${mes.sub > 0 ? 'R$&nbsp;'+mes.unit : '—'}</div>
              <div class="prov-extra">${mes.qtd > 0 ? mes.qtd+' cotas' : ''}</div>
              <div class="prov-total">${mes.sub > 0 ? fmt(mes.sub) : ''}</div>
            </div>
          </td>`).join('')}
      </tr>`;
    });
  });

  html += `</tbody>
    <tfoot><tr>
      <td class="td-ticker">TOTAL GERAL</td>
      ${info.totaisMensais.map(t => `<td>${fmt(t)}</td>`).join('')}
    </tr></tfoot>
  </table></div></div>`;

  const area = document.getElementById('content-area');
  area.innerHTML = html;

  /* Render charts */
  requestAnimationFrame(() => {
    renderEvolucao(nome);
    renderBarPie(nome);
  });
}

function kpiCard(label, value, sub, cardCls='', valCls='') {
  return `<div class="kpi-card animate-in ${cardCls}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value ${valCls}">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
  </div>`;
}

function renderBarPie(nome) {

  const ctxP = document.getElementById('cvs-pie');

    chartsBar = new Chart(ctxB, {
      type: 'bar',
      data: {
        labels: MESES,
        datasets: [{ label: 'Proventos R$', data: info.totaisMensais,
          backgroundColor: 'rgba(61,220,132,0.7)', borderRadius: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => fmt(c.parsed.y) } }
        },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a9480' } },
          y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7a9480', callback: v => fmt(v) } }
        }
      }
    });
  }

  if (ctxP) {
    const segs = Object.keys(info.segmentos);
    const vals = segs.map(s =>
      info.segmentos[s].reduce((a, ativo) => a + ativo.dadosMeses.reduce((x,m) => x+m.sub, 0), 0)
    );
    chartsPie = new Chart(ctxP, {
      type: 'doughnut',
      data: {
        labels: segs,
        datasets: [{ data: vals, backgroundColor: CHART_COLORS,
          borderColor: 'transparent', hoverOffset: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { color: '#7a9480', font: { size: 11 }, boxWidth: 10 } },
          tooltip: { callbacks: { label: c => `${c.label}: ${fmt(c.parsed)}` } }
        },
        cutout: '65%',
      }
    });
  }
}

function updateCharts(nome, filtro) {
  const info = GLOBAL.proventos[nome];
  if (!info || !chartsBar || !chartsPie) return;
  let dBar = Array(12).fill(0), lPie = [], dPie = [];

  if (filtro === 'TOTAL') {
    dBar = info.totaisMensais;
    Object.entries(info.segmentos).forEach(([s, ativos]) => {
      lPie.push(s);
      dPie.push(ativos.reduce((a,at) => a + at.dadosMeses.reduce((x,m) => x+m.sub, 0), 0));
    });
  } else if (info.segmentos[filtro]) {
    info.segmentos[filtro].forEach(at => {
      lPie.push(at.ticker);
      let soma = 0;
      at.dadosMeses.forEach((m,i) => { dBar[i] += m.sub; soma += m.sub; });
      dPie.push(soma);
    });
  }

  chartsBar.data.datasets[0].data  = dBar;
  chartsBar.data.datasets[0].label = `Filtro: ${filtro}`;
  chartsBar.update();
  chartsPie.data.labels = lPie;
  chartsPie.data.datasets[0].data = dPie;
  chartsPie.update();
}

/* =======================================================
   UI HELPERS
======================================================= */
function toggleSeg(cls) {
  document.querySelectorAll(`.${cls}`).forEach(r =>
    r.classList.toggle('hidden-row')
  );
}

function toggleProvSeg(cls, seg, nome) {
  const rows   = document.querySelectorAll(`.${cls}`);
  const hidden = rows.length > 0 && rows[0].classList.contains('hidden-row');
  document.querySelectorAll('[class*="pv-"]').forEach(r => r.classList.add('hidden-row'));
  if (hidden) {
    rows.forEach(r => r.classList.remove('hidden-row'));
    updateCharts(nome, seg);
  } else {
    updateCharts(nome, 'TOTAL');
  }
}

function toggleColProv(idx) {
  document.querySelectorAll(`.prov-col-${idx}`).forEach(c =>
    c.classList.toggle('col-active')
  );
}
