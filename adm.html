<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolução Mensal do Património</title>
  
  <!-- Carregamento do Chart.js para o Gráfico -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --primaria: #081c15;
      --secundaria: #1b4332;
      --destaque: #2d6a4f;
      --fundo: #f4f7f6;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--fundo);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .contentor {
      max-width: 1000px;
      margin: 0 auto;
    }

    .cabecalho {
      text-align: center;
      margin-bottom: 30px;
    }

    .cabecalho h1 {
      color: var(--primaria);
      margin: 0 0 10px 0;
    }

    .cartao {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      border-top: 5px solid var(--destaque);
    }

    .grafico-contentor {
      position: relative;
      height: 400px;
      width: 100%;
    }

    /* Estilos da Tabela */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th {
      background-color: var(--primaria);
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 0.9rem;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    .valor-monetario {
      font-weight: bold;
      color: var(--destaque);
    }

    #loading {
      text-align: center;
      padding: 50px;
      font-size: 1.2rem;
      color: var(--secundaria);
      font-weight: bold;
    }

    .escondido {
      display: none;
    }
  </style>
</head>
<body>

  <div class="contentor">
    <div class="cabecalho">
      <h1>Evolução Mensal (Base Património)</h1>
      <p>Análise de valores agregados por Mês e Ano - Ambiente GitHub</p>
    </div>

    <div id="loading">
      <p>A carregar e a processar dados locais...</p>
    </div>

    <div id="painel-dados" class="escondido">
      
      <!-- O Gráfico (Eixo X e Y) -->
      <div class="cartao">
        <h3 style="margin-top: 0; color: #1b4332;">Gráfico de Evolução</h3>
        <div class="grafico-contentor">
          <canvas id="meuGrafico"></canvas>
        </div>
      </div>

      <!-- A Tabela Detalhada -->
      <div class="cartao">
        <h3 style="margin-top: 0; color: #1b4332;">Tabela de Resumo</h3>
        <div style="overflow-x: auto;">
          <table id="tabela-resumo">
            <thead>
              <tr>
                <th>Mês / Ano</th>
                <th>Valor Total (R$)</th>
              </tr>
            </thead>
            <tbody>
              <!-- Inserido via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    let graficoInstancia = null;

    // SIMULAÇÃO DE DADOS: O que seria lido de um ficheiro JSON ou CSV no GitHub
    // Representa a Coluna G (valor) e Coluna H (dataLanc)
    const DADOS_BASE_PATRIMONIO = [
      { valor: "R$ 5.000,00", dataLanc: "15/01/2024" },
      { valor: "10000", dataLanc: "28/01/2024" },
      { valor: "18200.50", dataLanc: "10/02/2024" },
      { valor: "R$ 17.500,25", dataLanc: "05/03/2024" },
      { valor: "2000", dataLanc: "20/03/2024" },
      { valor: "R$ 22.000,00", dataLanc: "15/04/2024" },
      { valor: "25400.75", dataLanc: "10/05/2024" },
      { valor: "3000.00", dataLanc: "25/05/2024" }
    ];

    window.onload = function() {
      // Simula o tempo de carregamento de um ficheiro estático no GitHub (500ms)
      setTimeout(() => {
        const dadosProcessados = processarDados(DADOS_BASE_PATRIMONIO);
        desenharPainel(dadosProcessados);
      }, 500);
    };

    /**
     * Motor de Cálculo em JavaScript Puro (Substitui o Google Apps Script)
     * Lê a matriz, agrupa por mês/ano e soma os valores.
     */
    function processarDados(dadosBrutos) {
      const resumoMeses = {};

      dadosBrutos.forEach(linha => {
        let valorBruto = linha.valor;
        let dataBruta = linha.dataLanc;

        if (!dataBruta || !valorBruto) return;

        // 1. Converter Data (DD/MM/AAAA)
        let partes = dataBruta.toString().trim().split('/');
        if (partes.length !== 3) return;
        
        // Criar chave YYYY-MM para garantir a ordenação cronológica correta
        let ano = partes[2];
        let mes = partes[1].padStart(2, '0');
        let chave = `${ano}-${mes}`; 

        // 2. Limpar e Converter Valor (Remove R$, pontos separadores de milhar e troca vírgula por ponto)
        let valorTratado = valorBruto.toString().replace(/R\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.').trim();
        let valorNumerico = parseFloat(valorTratado);
        if (isNaN(valorNumerico)) valorNumerico = 0;

        // 3. Agrupar e Somar
        if (!resumoMeses[chave]) {
          resumoMeses[chave] = 0;
        }
        resumoMeses[chave] += valorNumerico;
      });

      // 4. Preparar Arrays para o Gráfico (Ordenados cronologicamente)
      const chavesOrdenadas = Object.keys(resumoMeses).sort();
      const labels = [];
      const valores = [];

      chavesOrdenadas.forEach(chave => {
        let [a, m] = chave.split('-');
        labels.push(`${m}/${a}`); // Converte de volta para MM/AAAA para o Eixo X
        valores.push(resumoMeses[chave]); // Eixo Y
      });

      return { labels, valores };
    }

    function desenharPainel(dados) {
      document.getElementById('loading').className = 'escondido';
      document.getElementById('painel-dados').className = '';

      if (!dados || dados.labels.length === 0) {
        document.getElementById('painel-dados').innerHTML = "<p style='text-align:center;'>Nenhum dado encontrado com datas e valores válidos.</p>";
        return;
      }

      desenharGrafico(dados.labels, dados.valores);
      preencherTabela(dados.labels, dados.valores);
    }

    function desenharGrafico(etiquetas, valores) {
      const ctx = document.getElementById('meuGrafico').getContext('2d');
      
      if (graficoInstancia) {
        graficoInstancia.destroy();
      }

      graficoInstancia = new Chart(ctx, {
        type: 'bar', // Altere para 'line' se desejar um gráfico de linhas
        data: {
          labels: etiquetas, // Eixo X (Meses/Anos)
          datasets: [{
            label: 'Valor Total Agregado (R$)',
            data: valores, // Eixo Y (Valores)
            backgroundColor: 'rgba(45, 106, 79, 0.8)',
            borderColor: '#1b4332',
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: true, position: 'top' },
            tooltip: {
              callbacks: {
                label: function(context) {
                  let valor = context.raw;
                  return 'R$ ' + valor.toLocaleString('pt-BR', {minimumFractionDigits: 2});
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return 'R$ ' + value.toLocaleString('pt-BR');
                }
              }
            }
          }
        }
      });
    }

    function preencherTabela(etiquetas, valores) {
      const tbody = document.querySelector('#tabela-resumo tbody');
      let html = '';

      for (let i = 0; i < etiquetas.length; i++) {
        let valorFormatado = valores[i].toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        html += `
          <tr>
            <td><strong>${etiquetas[i]}</strong></td>
            <td class="valor-monetario">${valorFormatado}</td>
          </tr>
        `;
      }

      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
